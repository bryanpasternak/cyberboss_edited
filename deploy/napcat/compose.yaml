services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: cyberboss-napcat
    restart: unless-stopped
    environment:
      ACCOUNT: "${NAPCAT_ACCOUNT:-}"
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
    mem_limit: 1g
    cpus: 1.0
